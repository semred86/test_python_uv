name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      #- name: Install uv
      #  uses: astral-sh/setup-uv@v8.2.0

      #- name: Install dependencies
     #   run: uv sync

     # - name: Run tests
       # run: uv run pytest

      - name: fingerprint
        run: |
          echo "${#FINGERPRINT}"
          echo "${FINGERPRINT}"
        env:
          FINGERPRINT: ${{ secrets.VDS_FINGERPRINT }}
      
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          #fingerprint: ${{ secrets.VDS_FINGERPRINT }} # Должно быть строго: SHA256:...
          script: |
            whoami
            ls -al
